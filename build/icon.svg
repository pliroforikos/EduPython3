<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="squircle">
      <rect x="14" y="14" width="228" height="228" rx="50" ry="50" />
    </clipPath>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b7fe9"/>
      <stop offset="100%" stop-color="#2464c8"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd53e"/>
      <stop offset="100%" stop-color="#ffb617"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-4%" width="110%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1b36" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g clip-path="url(#squircle)">
      <!-- Top half: Python blue -->
      <rect x="0" y="0" width="256" height="128" fill="url(#blueGrad)" />
      <!-- Bottom half: Python yellow -->
      <rect x="0" y="128" width="256" height="128" fill="url(#yellowGrad)" />
      <!-- Dividing line -->
      <line x1="14" y1="128" x2="242" y2="128" stroke="#1a4f9e" stroke-width="1.2" opacity="0.35" />
      <line x1="14" y1="129.2" x2="242" y2="129.2" stroke="#ffffff" stroke-width="1" opacity="0.45" />

      <!-- Text: "Py" on top in crisp white -->
      <text x="128" y="98"
            font-family="system-ui, -apple-system, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif"
            font-size="80"
            font-weight="bold"
            fill="#ffffff"
            text-anchor="middle"
            letter-spacing="-1">Py</text>

      <!-- Text: "3" on bottom in dark navy -->
      <text x="128" y="212"
            font-family="system-ui, -apple-system, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif"
            font-size="94"
            font-weight="bold"
            fill="#142338"
            text-anchor="middle">3</text>
    </g>
  </g>
</svg>
